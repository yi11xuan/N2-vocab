<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語彙帖 — N2 Vocabulary Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7E2D4; --paper-deep:#DCD5C2; --ink:#20293A; --ink-soft:#4B5A6E;
    --indigo:#33506E; --indigo-soft:#6E8CA6; --line:#C7BFA8; --seal:#B8401B;
    --seal-soft:#D9714B; --gold:#A9812F; --card-back:#1C2A3D; --card-back-2:#233650;
    --good:#3E6E4E;
    --font-display:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
    --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:transparent;}
  #app{font-family:var(--font-body);color:var(--ink);background:var(--paper);
    background-image:repeating-linear-gradient(0deg, rgba(32,41,58,0.025) 0px, rgba(32,41,58,0.025) 1px, transparent 1px, transparent 34px);
    min-height:100vh;padding:0 0 60px 0;}
  .wrap{max-width:860px;margin:0 auto;padding:28px 20px 0;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .wordmark{display:flex;align-items:baseline;gap:12px;}
  .wordmark h1{font-family:var(--font-display);font-weight:700;font-size:30px;margin:0;letter-spacing:0.04em;}
  .wordmark .sub{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-soft);}
  nav.tabs{display:flex;gap:2px;background:var(--paper-deep);border:1px solid var(--line);border-radius:8px;padding:3px;overflow-x:auto;}
  nav.tabs button{font-family:var(--font-body);font-weight:700;font-size:13px;background:transparent;border:none;
    color:var(--ink-soft);padding:8px 12px;border-radius:6px;cursor:pointer;transition:all .15s ease;white-space:nowrap;}
  nav.tabs button.active{background:var(--ink);color:var(--paper);}
  nav.tabs button:hover:not(.active){color:var(--ink);}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
  .stat{background:var(--paper-deep);border:1px solid var(--line);border-radius:10px;padding:14px 12px;position:relative;overflow:hidden;}
  .stat .num{font-family:var(--font-mono);font-size:26px;font-weight:600;color:var(--ink);}
  .stat .lbl-jp{font-family:var(--font-display);font-size:13px;color:var(--indigo);margin-top:2px;}
  .stat .lbl-en{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);}
  .stat.due .num{color:var(--seal);} .stat.mastered .num{color:var(--gold);}
  .cta{display:block;width:100%;text-align:center;background:var(--ink);color:var(--paper);border:none;
    font-family:var(--font-display);font-weight:700;font-size:18px;padding:18px;border-radius:10px;cursor:pointer;
    letter-spacing:0.03em;margin-bottom:16px;transition:transform .1s ease, background .15s ease;}
  .cta:hover{background:var(--indigo);} .cta:active{transform:scale(0.99);}
  .cta.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink);font-size:15px;padding:12px;}
  .cta.secondary:hover{background:var(--ink);color:var(--paper);}
  .cta:disabled{opacity:0.45;cursor:not-allowed;background:var(--ink-soft);}
  .panel{background:var(--paper-deep);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
  .panel h2{font-family:var(--font-display);font-size:18px;margin:0 0 10px;color:var(--ink);}
  .muted{color:var(--ink-soft);font-size:13px;line-height:1.6;}
  .hanko{position:absolute;top:10px;right:10px;width:34px;height:34px;border:2.5px solid var(--seal);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--seal);font-family:var(--font-display);
    font-weight:700;font-size:11px;transform:rotate(-8deg);opacity:0.9;}
  .hanko.big{width:78px;height:78px;font-size:22px;border-width:4px;position:static;transform:rotate(-6deg);
    margin:0 auto 10px;animation:stamp .35s ease;}
  @keyframes stamp{from{transform:scale(1.6) rotate(-6deg);opacity:0;}to{transform:scale(1) rotate(-6deg);opacity:0.9;}}
  .stage{display:flex;flex-direction:column;align-items:center;padding:10px 0 20px;}
  .progress{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);margin-bottom:6px;letter-spacing:0.05em;}
  .topic-banner{font-size:12px;color:var(--indigo);margin-bottom:14px;font-weight:700;letter-spacing:0.02em;}
  .card-scene{width:100%;max-width:460px;height:320px;perspective:1400px;margin-bottom:22px;}
  .card{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);cursor:pointer;}
  .card.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;}
  .face.front{background:var(--card-back);color:var(--paper);box-shadow:0 8px 24px rgba(28,42,61,0.3);
    border:1px solid rgba(255,255,255,0.06);}
  .face.back{background:var(--paper);color:var(--ink);transform:rotateY(180deg);border:1.5px solid var(--ink);}
  .chip-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;}
  .pos-chip{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;
    background:rgba(255,255,255,0.1);color:var(--indigo-soft);padding:3px 9px;border-radius:100px;}
  .topic-chip{font-family:var(--font-body);font-size:10.5px;background:rgba(255,255,255,0.1);
    color:var(--seal-soft);padding:3px 10px;border-radius:100px;}
  .face.back .pos-chip{background:var(--paper);border:1px solid var(--line);color:var(--indigo);}
  .face.back .topic-chip{background:var(--paper);border:1px solid var(--seal);color:var(--seal);}
  .kana-top{font-size:14px;color:var(--indigo-soft);margin-bottom:6px;letter-spacing:0.06em;}
  .kanji-big{font-family:var(--font-display);font-size:42px;font-weight:600;line-height:1.2;}
  .kanji-row{display:flex;align-items:center;gap:10px;}
  .hint{position:absolute;bottom:14px;font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:0.08em;}
  .meaning-big{font-family:var(--font-display);font-size:20px;font-weight:600;margin-bottom:8px;}
  .kana-sub{font-size:13px;color:var(--ink-soft);margin-bottom:2px;}
  .example-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);width:100%;}
  .example-jp{font-size:14.5px;line-height:1.6;display:flex;align-items:flex-start;gap:6px;justify-content:center;}
  .example-en{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .spk-btn{background:none;border:none;cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;
    color:inherit;opacity:0.75;flex-shrink:0;}
  .spk-btn:hover{opacity:1;}
  .grade-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:460px;}
  .grade-row button{font-family:var(--font-body);font-weight:700;font-size:13px;border:none;border-radius:9px;
    padding:13px 4px;cursor:pointer;color:#fff;transition:transform .1s ease;}
  .grade-row button:hover{transform:translateY(-2px);}
  .g-again{background:var(--seal);} .g-hard{background:#8a6a3a;} .g-good{background:var(--good);} .g-easy{background:var(--indigo);}
  .grade-sub{display:block;font-weight:400;font-size:10px;opacity:0.8;margin-top:2px;}
  .flip-tip{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .score-chip{font-family:var(--font-mono);font-size:13px;background:var(--paper-deep);border:1px solid var(--line);padding:6px 12px;border-radius:100px;}
  .quiz-card{background:var(--card-back);color:var(--paper);border-radius:16px;padding:32px 24px;text-align:center;margin-bottom:16px;}
  .quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .quiz-options button{text-align:left;font-family:var(--font-body);font-size:14px;font-weight:500;
    background:var(--paper-deep);border:1.5px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;
    color:var(--ink);transition:all .12s ease;}
  .quiz-options button:hover:not(:disabled){border-color:var(--indigo);}
  .quiz-options button.correct{background:var(--good);border-color:var(--good);color:#fff;}
  .quiz-options button.wrong{background:var(--seal);border-color:var(--seal);color:#fff;}
  .quiz-options button:disabled{cursor:default;}
  .quiz-example{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.15);font-size:13px;color:rgba(231,226,212,0.75);}
  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .search-bar{flex:1;min-width:180px;padding:12px 14px;border-radius:9px;border:1.5px solid var(--line);
    background:var(--paper-deep);color:var(--ink);font-family:var(--font-body);font-size:14px;}
  .search-bar:focus{outline:none;border-color:var(--indigo);}
  select.topic-select{padding:12px 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper-deep);
    color:var(--ink);font-family:var(--font-body);font-size:13px;}
  .word-row{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line);}
  .word-row .k{font-family:var(--font-display);font-size:17px;min-width:88px;}
  .word-row .r{font-size:12px;color:var(--ink-soft);min-width:82px;}
  .word-row .m{font-size:13px;flex:1;color:var(--ink);}
  .badge{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .b-new{background:var(--ink-soft);opacity:0.4;} .b-learning{background:var(--indigo-soft);}
  .b-review{background:var(--indigo);} .b-mastered{background:var(--gold);}
  .mini-hanko{color:var(--seal);font-size:10px;border:1.5px solid var(--seal);border-radius:50%;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;transform:rotate(-8deg);}
  .spk-mini{background:none;border:none;cursor:pointer;font-size:14px;color:var(--indigo);opacity:0.7;flex-shrink:0;}
  .spk-mini:hover{opacity:1;}
  .topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  .topic-tile{background:var(--paper-deep);border:1px solid var(--line);border-radius:10px;padding:14px;
    cursor:pointer;text-align:left;transition:all .12s ease;}
  .topic-tile:hover{border-color:var(--indigo);transform:translateY(-1px);}
  .topic-tile .tjp{font-family:var(--font-display);font-size:15px;color:var(--ink);}
  .topic-tile .ten{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
  .topic-tile .tct{font-family:var(--font-mono);font-size:11px;color:var(--seal);margin-top:6px;}
  textarea.add-input{width:100%;min-height:120px;border-radius:9px;border:1.5px solid var(--line);
    background:var(--paper-deep);color:var(--ink);font-family:var(--font-mono);font-size:13px;padding:12px;
    resize:vertical;margin-bottom:10px;}
  textarea.add-input:focus{outline:none;border-color:var(--indigo);}
  select.topic-picker{width:100%;padding:12px;border-radius:9px;border:1.5px solid var(--line);
    background:var(--paper-deep);color:var(--ink);font-family:var(--font-body);font-size:13px;margin-bottom:10px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:11px 20px;border-radius:100px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,0.25);z-index:50;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-state .kanji-big{opacity:0.15;margin-bottom:10px;}
  @media (max-width:520px){.stats-row{grid-template-columns:repeat(2,1fr);} .quiz-options{grid-template-columns:1fr;}
    .topic-grid{grid-template-columns:1fr;} nav.tabs{overflow-x:auto;}}
</style>
</head>

function wordId(prefix, idx){ return prefix + idx; }

function buildAllWords(){
  allWords = BASE_WORDS.map((w,i)=>({id:wordId('b',i), k:w[0], r:w[1], m:w[2], p:w[3], t:w[4], ej:w[5]||'', en:w[6]||''}))
    .concat(customWords.map((w)=>({id:w.id, k:w.k, r:w.r, m:w.m, p:w.p||'n', t:w.t||'daily', ej:w.ej||'', en:w.en||''})));
}

async function loadData(){
  try{ const r = await window.storage.get('srs-state', false); srsState = r && r.value ? JSON.parse(r.value) : {}; }
  catch(e){ srsState = {}; }
  try{ const r = await window.storage.get('custom-words', false); customWords = r && r.value ? JSON.parse(r.value) : []; }
  catch(e){ customWords = []; }
  buildAllWords();
  dataLoaded = true;
}
async function saveSrs(){ try{ await window.storage.set('srs-state', JSON.stringify(srsState), false); }catch(e){ console.error('save srs failed', e); } }
async function saveCustom(){ try{ await window.storage.set('custom-words', JSON.stringify(customWords), false); }catch(e){ console.error('save custom failed', e); } }

function getState(id){
  if(!srsState[id]) srsState[id] = {ef:2.5, interval:0, reps:0, due:Date.now(), lapses:0, status:'new'};
  return srsState[id];
}
function gradeWord(id, grade){
  const s = getState(id); const now = Date.now(); const DAY = 86400000;
  if(grade===0){ s.reps=0; s.interval=0; s.lapses+=1; s.ef=Math.max(1.3, s.ef-0.2); s.due=now+5*60000; s.status='learning'; }
  else{
    if(grade===1){ s.interval = s.interval? Math.round(s.interval*1.2):1; s.ef=Math.max(1.3, s.ef-0.15); }
    else if(grade===2){ if(s.reps===0) s.interval=1; else if(s.reps===1) s.interval=3; else s.interval=Math.max(1, Math.round(s.interval*s.ef)); }
    else if(grade===3){ s.interval = s.reps===0 ? 4 : Math.max(1, Math.round(s.interval*s.ef*1.3)); s.ef += 0.15; }
    s.reps += 1; s.due = now + s.interval*DAY;
    if(s.interval>=60 || s.reps>=8) s.status='mastered';
    else if(s.interval>=14) s.status='review';
    else s.status='learning';
  }
  saveSrs();
}
function counts(list){
  const src = list || allWords; const now = Date.now();
  let nw=0, learning=0, review=0, mastered=0, due=0;
  src.forEach(w=>{
    const s = srsState[w.id];
    if(!s || s.status==='new'){ nw++; return; }
    if(s.status==='mastered') mastered++; else if(s.status==='review') review++; else learning++;
    if(s.due<=now) due++;
  });
  return {nw, learning, review, mastered, due:due+nw};
}

  const map = {};
  Object.keys(TOPICS).forEach(k=>map[k]={total:0, mastered:0});
  allWords.forEach(w=>{
    if(!map[w.t]) map[w.t]={total:0, mastered:0};
    map[w.t].total++;
    const s = srsState[w.id];
    if(s && s.status==='mastered') map[w.t].mastered++;
  });
  return map;
}

/* =====================  SPEECH  ===================== */
let voicesReady = false;
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{ voicesReady = true; };
}
function speak(text){
  if(!('speechSynthesis' in window)){ showToast('Speech not supported in this browser'); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 0.88; u.pitch = 1;
    const voices = speechSynthesis.getVoices();
    const jaVoice = voices.find(v=>v.lang && v.lang.startsWith('ja'));
    if(jaVoice) u.voice = jaVoice;
    speechSynthesis.speak(u);
  }catch(e){ console.error('speech error', e); }
}

/* =====================  RENDER  ===================== */
function root(){ return document.getElementById('root'); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function posLabel(p){ return {n:'noun', v:'verb', adj:'adjective', adv:'adverb'}[p] || p; }

function render(){
  if(!dataLoaded){ root().innerHTML = '<div class="wrap"><p class="muted">Loading your word desk…</p></div>'; return; }
  const c = counts();
  let body = '';
  if(currentTab==='home') body = renderHome(c);
  else if(currentTab==='study') body = renderStudy();
  else if(currentTab==='topics') body = renderTopics();
  else if(currentTab==='browse') body = renderBrowse();
  else if(currentTab==='quiz') body = renderQuiz();
  else if(currentTab==='add') body = renderAdd();

  root().innerHTML = `
    <div class="wrap">
      <header class="top">
        <div class="wordmark"><h1>語彙帖</h1><span class="sub">N2 Vocabulary Desk</span></div>
        <nav class="tabs">
          <button data-tab="home" class="${currentTab==='home'?'active':''}">Home</button>
          <button data-tab="study" class="${currentTab==='study'?'active':''}">Study</button>
          <button data-tab="topics" class="${currentTab==='topics'?'active':''}">Topics</button>
          <button data-tab="quiz" class="${currentTab==='quiz'?'active':''}">Quiz</button>
          <button data-tab="browse" class="${currentTab==='browse'?'active':''}">単語帳</button>
          <button data-tab="add" class="${currentTab==='add'?'active':''}">Add</button>
        </nav>
      </header>
      ${body}
    </div>`;
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = ()=>{ currentTab=b.dataset.tab; flipped=false; currentCard=null; quizCurrent=null; if(currentTab==='study'){studyMode='due'; studyTopic=null; studyQueue=[];} render(); };
  });
  attachTabHandlers();
}

function renderHome(c){
  const mastered = c.mastered;
  return `
    <div class="stats-row">
      <div class="stat due"><div class="num">${c.due}</div><div class="lbl-jp">復習</div><div class="lbl-en">Due now</div></div>
      <div class="stat"><div class="num">${c.learning}</div><div class="lbl-jp">学習中</div><div class="lbl-en">Learning</div></div>
      <div class="stat"><div class="num">${c.review}</div><div class="lbl-jp">定着</div><div class="lbl-en">In review</div></div>
      <div class="stat mastered"><div class="num">${mastered}</div><div class="lbl-jp">習得</div><div class="lbl-en">Mastered</div></div>
    </div>
    ${mastered>0 ? `<div class="panel" style="text-align:center;"><div class="hanko big">習得</div><div class="muted">${mastered} word${mastered===1?'':'s'} stamped as mastered. Nice work.</div></div>` : ''}
    <button class="cta" id="startDue" ${c.due===0?'disabled':''}>Start Review — ${c.due} due</button>
    <button class="cta secondary" id="startAll">Browse Flashcards (all ${allWords.length} words)</button>
    <button class="cta secondary" id="goTopics">Study by Topic / Situation</button>
    <div class="panel">
      <h2>How this works</h2>
      <p class="muted">Flip each card, listen with the 🔊 button, and grade how well you knew it — the desk reschedules that word using spaced repetition. Every word has one example sentence, a topic tag, and audio via your browser's built-in text-to-speech. Use Quiz for a lighter multiple-choice pass, Topics to focus on a situation (travel, health, work…), and Add to paste in your own words.</p>
    </div>`;
}

function pickQueue(mode, topic){
  const now = Date.now();
  let pool = allWords.slice();
  if(topic) pool = pool.filter(w=>w.t===topic);
  if(mode==='due') pool = pool.filter(w=>{ const s=srsState[w.id]; return !s || s.status==='new' || s.due<=now; });
  else if(mode==='new') pool = pool.filter(w=>{ const s=srsState[w.id]; return !s || s.status==='new'; });
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool;
}

function renderStudy(){
  if(!studyQueue.length && !currentCard){ studyQueue = pickQueue(studyMode, studyTopic); currentCard = studyQueue.shift(); }
  if(!currentCard){
    return `<div class="empty-state"><div class="kanji-big">完</div><p>Nothing left to study right now — nicely done.</p>
      <button class="cta secondary" id="studyAllBtn" style="max-width:280px;margin:14px auto 0;">Study All Words Anyway</button></div>`;
  }
  const total = studyQueue.length + 1;
  const topicLabel = studyTopic ? `${TOPICS[studyTopic].jp} · ${TOPICS[studyTopic].en}` : 'All words';
  return `
    <div class="stage">
      <div class="topic-banner">${esc(topicLabel)}</div>
      <div class="progress">${total} word${total===1?'':'s'} remaining in this session</div>
      <div class="card-scene">
        <div class="card ${flipped?'flipped':''}" id="flashcard">
          <div class="face front">
            <div class="chip-row"><span class="pos-chip">${posLabel(currentCard.p)}</span><span class="topic-chip">${esc(TOPICS[currentCard.t]?TOPICS[currentCard.t].jp:currentCard.t)}</span></div>
            <div class="kanji-row"><div class="kanji-big">${esc(currentCard.k)}</div><button class="spk-btn" id="spkFront" title="Play pronunciation">🔊</button></div>
            <div class="hint">tap card to reveal</div>
          </div>
          <div class="face back">
            <div class="chip-row"><span class="pos-chip">${posLabel(currentCard.p)}</span><span class="topic-chip">${esc(TOPICS[currentCard.t]?TOPICS[currentCard.t].jp:currentCard.t)}</span></div>
            <div class="kana-sub">${esc(currentCard.r)}</div>
            <div class="meaning-big">${esc(currentCard.m)}</div>
            ${currentCard.ej ? `<div class="example-box">
              <div class="example-jp"><span>${esc(currentCard.ej)}</span><button class="spk-btn" id="spkBack" title="Play sentence" style="color:var(--ink);">🔊</button></div>
              <div class="example-en">${esc(currentCard.en)}</div>
            </div>` : ''}
          </div>
        </div>
      </div>
      ${flipped ? `
      <div class="grade-row">
        <button class="g-again" data-g="0">Again<span class="grade-sub">forgot it</span></button>
        <button class="g-hard" data-g="1">Hard<span class="grade-sub">tough recall</span></button>
        <button class="g-good" data-g="2">Good<span class="grade-sub">got it</span></button>
        <button class="g-easy" data-g="3">Easy<span class="grade-sub">instant</span></button>
      </div>` : `<p class="flip-tip">Click the card to see the reading, meaning, and example.</p>`}
    </div>`;
}

function renderTopics(){
  const tc = topicCounts();
  const tiles = Object.keys(TOPICS).map(code=>{
    const info = TOPICS[code]; const cnt = tc[code] || {total:0,mastered:0};
    return `<button class="topic-tile" data-topic="${code}">
      <div class="tjp">${esc(info.jp)}</div>
      <div class="ten">${esc(info.en)}</div>
      <div class="tct">${cnt.total} words${cnt.mastered? ` · ${cnt.mastered} mastered`:''}</div>
    </button>`;
  }).join('');
  return `
    <div class="panel"><h2>Study by Topic / Situation</h2><p class="muted">Pick a topic to study just those words — due words first, then the rest of the set.</p></div>
    <div class="topic-grid">${tiles}</div>`;
}

function renderQuiz(){
  if(!quizCurrent){ const pool = allWords; quizCurrent = pool[Math.floor(Math.random()*pool.length)]; quizAnswered = false; }
  const correct = quizCurrent;
  let distractors = allWords.filter(w=>w.id!==correct.id);
  for(let i=distractors.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [distractors[i],distractors[j]]=[distractors[j],distractors[i]]; }
  distractors = distractors.slice(0,3);
  let options = [correct, ...distractors];
  if(!quizCurrent._opts){
    for(let i=options.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [options[i],options[j]]=[options[j],options[i]]; }
    quizCurrent._opts = options;
  } else { options = quizCurrent._opts; }
  const pct = quizScore.total ? Math.round(100*quizScore.correct/quizScore.total) : 0;
  return `
    <div class="quiz-head"><span class="muted">Multiple choice</span><span class="score-chip">${quizScore.correct} / ${quizScore.total} correct (${pct}%)</span></div>
    <div class="quiz-card">
      <div class="chip-row"><span class="pos-chip">${posLabel(correct.p)}</span><span class="topic-chip">${esc(TOPICS[correct.t]?TOPICS[correct.t].jp:correct.t)}</span></div>
      <div class="kanji-row" style="justify-content:center;"><div class="kana-top" style="margin:0 8px 0 0;">${esc(correct.r)}</div></div>
      <div class="kanji-row" style="justify-content:center;"><div class="kanji-big">${esc(correct.k)}</div><button class="spk-btn" id="spkQuiz" title="Play pronunciation">🔊</button></div>
      ${quizAnswered && correct.ej ? `<div class="quiz-example">${esc(correct.ej)}<br>${esc(correct.en)}</div>` : ''}
    </div>
    <div class="quiz-options">
      ${options.map((o,i)=>`<button data-id="${o.id}" data-idx="${i}" ${quizAnswered?'disabled':''} class="${quizAnswered && o.id===correct.id?'correct':''} ${quizAnswered && o.id!==correct.id && o._picked?'wrong':''}">${esc(o.m)}</button>`).join('')}
    </div>
    ${quizAnswered ? `<button class="cta" id="nextQuiz" style="margin-top:16px;">Next Word</button>` : ''}`;
}

function renderBrowse(){
  const q = (window.__browseQuery||'').toLowerCase();
  let filtered = allWords.filter(w=> !q || w.k.includes(q) || w.r.includes(q) || w.m.toLowerCase().includes(q));
  if(browseTopicFilter) filtered = filtered.filter(w=>w.t===browseTopicFilter);
  const rows = filtered.slice(0,500).map(w=>{
    const s = srsState[w.id]; const status = s ? s.status : 'new';
    return `<div class="word-row">
      <span class="badge b-${status}"></span>
      <span class="k">${esc(w.k)}</span>
      <span class="r">${esc(w.r)}</span>
      <span class="m">${esc(w.m)}</span>
      <button class="spk-mini" data-speak="${esc(w.k)}" title="Play">🔊</button>
      ${status==='mastered' ? '<span class="mini-hanko">習</span>' : ''}
    </div>`;
  }).join('');
  const topicOptions = `<option value="">All topics</option>` + Object.keys(TOPICS).map(code=>`<option value="${code}" ${browseTopicFilter===code?'selected':''}>${esc(TOPICS[code].jp)}</option>`).join('');
  return `
    <div class="filter-row">
      <input class="search-bar" id="browseSearch" placeholder="Search kanji, kana, or meaning…" value="${esc(window.__browseQuery||'')}">
      <select class="topic-select" id="browseTopicSelect">${topicOptions}</select>
    </div>
    <div class="panel" style="padding:6px 14px;">
      ${filtered.length? rows : '<p class="muted" style="padding:14px 0;">No words match that search.</p>'}
    </div>
    <p class="muted">${filtered.length} of ${allWords.length} words shown.</p>`;
}

function renderAdd(){
  const topicOptions = Object.keys(TOPICS).map(code=>`<option value="${code}">${esc(TOPICS[code].jp)} — ${esc(TOPICS[code].en)}</option>`).join('');
  return `
    <div class="panel">
      <h2>Add your own words</h2>
      <p class="muted">One word per line: <code>kanji,kana,meaning,pos,example_jp,example_en</code> — pos is n/v/adj/adv. The last two (example sentence) are optional. Example:<br>
      皮肉,ひにく,irony; sarcasm,n,彼の発言は皮肉だった。,His remark was ironic.</p>
      <select class="topic-picker" id="addTopicSelect">${topicOptions}</select>
      <textarea class="add-input" id="addInput" placeholder="皮肉,ひにく,irony; sarcasm,n,彼の発言は皮肉だった。,His remark was ironic."></textarea>
      <button class="cta" id="addBtn">Add Words to Selected Topic</button>
    </div>
    <div class="panel"><h2>Your custom words</h2><p class="muted">${customWords.length} word${customWords.length===1?'':'s'} added so far.</p></div>`;
}

/* =====================  EVENT HANDLERS  ===================== */
function attachTabHandlers(){
  if(currentTab==='home'){
    const btnDue=document.getElementById('startDue'), btnAll=document.getElementById('startAll'), btnTopics=document.getElementById('goTopics');
    if(btnDue) btnDue.onclick=()=>{ studyMode='due'; studyTopic=null; studyQueue=[]; currentCard=null; flipped=false; currentTab='study'; render(); };
    if(btnAll) btnAll.onclick=()=>{ studyMode='all'; studyTopic=null; studyQueue=[]; currentCard=null; flipped=false; currentTab='study'; render(); };
    if(btnTopics) btnTopics.onclick=()=>{ currentTab='topics'; render(); };
  }
  if(currentTab==='study'){
    const cardEl=document.getElementById('flashcard');
    if(cardEl) cardEl.onclick=(e)=>{ if(e.target.closest('.spk-btn')) return; flipped=!flipped; render(); };
    const spkFront=document.getElementById('spkFront');
    if(spkFront) spkFront.onclick=(e)=>{ e.stopPropagation(); speak(currentCard.k); };
    const spkBack=document.getElementById('spkBack');
    if(spkBack) spkBack.onclick=(e)=>{ e.stopPropagation(); speak(currentCard.ej || currentCard.k); };
    document.querySelectorAll('.grade-row button').forEach(b=>{
      b.onclick=(e)=>{ e.stopPropagation(); const g=parseInt(b.dataset.g,10); gradeWord(currentCard.id, g);
        currentCard = studyQueue.shift() || null; flipped=false; render(); };
    });
    const allBtn=document.getElementById('studyAllBtn');
    if(allBtn) allBtn.onclick=()=>{ studyMode='all'; studyTopic=null; studyQueue=[]; currentCard=null; flipped=false; render(); };
  }
  if(currentTab==='topics'){
    document.querySelectorAll('.topic-tile').forEach(t=>{
      t.onclick=()=>{ studyMode='due'; studyTopic=t.dataset.topic; studyQueue=[]; currentCard=null; flipped=false; currentTab='study'; render(); };
    });
  }
  if(currentTab==='quiz'){
    const spkQuiz=document.getElementById('spkQuiz');
    if(spkQuiz) spkQuiz.onclick=()=>{ speak(quizCurrent.k); };
    document.querySelectorAll('.quiz-options button').forEach(b=>{
      b.onclick=()=>{
        if(quizAnswered) return; quizAnswered=true;
        const chosenId=b.dataset.id;
        quizCurrent._opts.forEach(o=>{ if(o.id===chosenId) o._picked=true; });
        quizScore.total+=1;
        if(chosenId===quizCurrent.id){ quizScore.correct+=1; gradeWord(quizCurrent.id, 2); }
        else{ gradeWord(quizCurrent.id, 0); }
        render();
      };
    });
    const next=document.getElementById('nextQuiz');
    if(next) next.onclick=()=>{ quizCurrent=null; quizAnswered=false; render(); };
  }
  if(currentTab==='browse'){
    const s=document.getElementById('browseSearch');
    if(s){ s.oninput=()=>{ window.__browseQuery=s.value; renderBrowseOnly(); }; s.focus(); s.selectionStart=s.selectionEnd=s.value.length; }
    const sel=document.getElementById('browseTopicSelect');
    if(sel){ sel.onchange=()=>{ browseTopicFilter=sel.value; renderBrowseOnly(); }; }
    document.querySelectorAll('[data-speak]').forEach(b=>{ b.onclick=()=>{ speak(b.dataset.speak); }; });
  }
  if(currentTab==='add'){
    const btn=document.getElementById('addBtn');
    if(btn) btn.onclick=async ()=>{
      const raw=document.getElementById('addInput').value;
      const topic=document.getElementById('addTopicSelect').value;
      const lines=raw.split('\\n').map(l=>l.trim()).filter(Boolean);
      let added=0;
      lines.forEach(line=>{
        const parts=line.split(',').map(p=>p.trim());
        if(parts.length>=3){
          const [k,r,m,p,ej,en]=parts;
          customWords.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,7), k, r, m, p:(p||'n'), t:topic, ej:ej||'', en:en||''});
          added++;
        }
      });
      if(added>0){ await saveCustom(); buildAllWords(); showToast(`Added ${added} word${added===1?'':'s'} to ${TOPICS[topic].jp}.`); document.getElementById('addInput').value=''; render(); }
      else{ showToast('No valid lines found — use kanji,kana,meaning'); }
    };
  }
}

function renderBrowseOnly(){
  const wrap=document.querySelector('#root'); const header=wrap.querySelector('header.top'); const full=renderBrowse();
  const oldSearch=document.getElementById('browseSearch'); const cursorPos=oldSearch?oldSearch.selectionStart:null;
  wrap.innerHTML = header.outerHTML + full;
  const newSearch=document.getElementById('browseSearch');
  if(newSearch){ newSearch.oninput=()=>{ window.__browseQuery=newSearch.value; renderBrowseOnly(); }; newSearch.focus(); if(cursorPos!==null) newSearch.selectionStart=newSearch.selectionEnd=cursorPos; }
  const sel=document.getElementById('browseTopicSelect');
  if(sel){ sel.onchange=()=>{ browseTopicFilter=sel.value; renderBrowseOnly(); }; }
  document.querySelectorAll('[data-speak]').forEach(b=>{ b.onclick=()=>{ speak(b.dataset.speak); }; });
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick=()=>{ currentTab=b.dataset.tab; flipped=false; currentCard=null; quizCurrent=null; render(); };
  });
}

function showToast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}

/* =====================  INIT  ===================== */
(async function init(){ await loadData(); render(); })();
</script>
</body>
</html>
